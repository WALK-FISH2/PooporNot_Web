<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拉了么</title>
    <link rel="stylesheet" href="./styles.css?v=20260805-tools" />
  </head>
  <body>
    <main class="app-shell">
      <div id="map" class="map-surface" aria-label="厕所地图"></div>

      <section class="brand-panel" aria-label="应用状态">
        <div>
          <p class="eyebrow">拉了么</p>
          <h1>附近厕所</h1>
        </div>
        <div class="status-pill" id="statusPill">启动中</div>
      </section>

      <section class="search-panel" aria-label="选择城市和基准地点">
        <label class="search-field region-field">
          <span>区域</span>
          <select id="regionSelect">
            <option value="mainland">中国大陆</option>
            <option value="overseas">其他地区</option>
          </select>
        </label>
        <label class="search-field city-field">
          <span>城市</span>
          <input id="cityInput" type="text" placeholder="输入城市" autocomplete="off" />
          <select id="overseasCitySelect" hidden aria-label="选择海外城市"></select>
        </label>
        <button id="cityButton" class="secondary-button city-action" type="button">切换城市</button>
        <label class="search-field place-field">
          <span>地点</span>
          <input id="placeInput" type="text" placeholder="小区、商场、地铁站或地址" autocomplete="off" />
        </label>
        <label class="search-field compact">
          <span>半径</span>
          <select id="radiusSelect">
            <option value="300">300 m</option>
            <option value="500">500 m</option>
            <option value="1000" selected>1 km</option>
            <option value="3000">3 km</option>
          </select>
        </label>
        <button id="placeButton" class="secondary-button place-action" type="button">搜地点</button>
        <button id="searchButton" class="primary-button toilet-action" type="button">查厕所</button>
      </section>

      <nav class="map-tools" aria-label="地图工具">
        <button id="locateButton" class="tool-button" type="button" title="定位">
          <span aria-hidden="true">◎</span>
        </button>
        <button id="metroButton" class="tool-button" type="button" title="查看附近地铁" aria-label="查看附近地铁">
          <span class="tool-text" aria-hidden="true">铁</span>
        </button>
        <button id="themeButton" class="tool-button" type="button" title="切换夜晚版" aria-label="切换夜晚版">
          <span id="themeIcon" aria-hidden="true">☾</span>
        </button>
      </nav>

      <aside class="result-drawer" aria-label="结果列表">
        <div class="drawer-head">
          <div>
            <p class="eyebrow" id="drawerEyebrow">结果</p>
            <h2 id="resultTitle">等待搜索</h2>
          </div>
          <span id="resultCount">0</span>
        </div>
        <div id="resultList" class="result-list"></div>
      </aside>

    </main>

    <script src="./web-core.js?v=20260805-tools"></script>
    <script src="./web-map-adapters.js?v=20260805-tools"></script>
    <script src="./app.js?v=20260805-tools"></script>
  </body>
</html>
